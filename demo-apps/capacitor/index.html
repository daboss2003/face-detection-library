<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Liveness Capacitor Demo</title>
    <style>
      html, body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; padding: 48px 20px; gap: 16px; background: #fff; }
      h1 { font-size: 22px; margin: 0; }
      button {
        background: #12c95c; color: #fff; border: 0;
        padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 600;
      }
      button:disabled { opacity: 0.5; }
      #step { color: #555; font-size: 14px; }
      #status { font-size: 15px; text-align: center; max-width: 320px; }
    </style>
  </head>
  <body>
    <h1>Liveness Capacitor demo</h1>
    <button id="start">Start verification</button>
    <div id="step"></div>
    <div id="status">Tap to start liveness (native UI).</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
